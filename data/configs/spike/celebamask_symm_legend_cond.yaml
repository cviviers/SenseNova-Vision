# CelebAMask-HQ: celebamask_symm_legend.yaml plus conditional slices (docs/SYMMETRIC.md): in half of the
# samples one stream is clean and the other has its own noise level, so that segmentation can hold the photo clean
# at every step (--symm_hold_known), as a conditional model does, while the other half stays on the symmetric
# diagonal. Fewer samples sit at the endpoints, which matter mainly for one-step readout. Train with
# --symm_clean_weight 0 (no loss on a clean stream) and --timestep_shift 1.0; same recipe as the from-base run.
#   bash scripts/spike_submit.sh celeba-symm-legend-cond lora data/configs/spike/celebamask_symm_legend_cond.yaml --timestep_shift 1.0 \
#       --symm_clean_weight 0 --total_steps 4000 --warmup_steps 100 --lr 2e-4 --save_every 500
# Evaluate with --symm --format legend --symm_hold_known --symm_seg_steps 50 --symm_cfg_scale 2.0.

celebamask_multitask:
  datasets:
    celebamask_hq:
      data_dir: /data/datasets/segmentation/CelebAMask-HQ
      num_total_samples: 24183
  split: train
  mode_weights:
    symm_legend: 1.0
  symm_beta: 10            # map dequantization, 0-255 scale
  symm_vit_prob: 0.5       # share of samples with the photo's ViT tokens as a clean prefix; 0 = pure symmetric flow
  symm_endpoint_prob: 0.05 # share of diagonal samples at t = 0 or 1 (one-step readout); the rest is uniform
  symm_cond_prob: 0.5      # share of samples with one stream clean and the other at its own uniform level
  symm_cond_photo_share: 0.5  # of those, share with the photo clean (segmentation); the rest has the map clean
  symm_text_dropout: 0.1   # share of samples without prompt and legend: the unconditional branch for text guidance
  image_transform_args:
    image_stride: 16
    max_image_size: 512
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  shuffle_seed: 0
  weight: 1.0
