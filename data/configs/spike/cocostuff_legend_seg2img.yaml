# COCO-Stuff (171 classes), two modes mixed in one run with 50/50 sampling (CocoStuffMultiTaskDataset,
# data/cocostuff.py), read straight from the zips. Same as cocostuff_img2palette_seg2img.yaml except that
# segmentation uses the released model's own generic-segmentation format instead of the fixed palette:
#   img2palette_legend  photo -> colour legend <p>class<color>(R, G, B)</color></p> of the classes present
#                       (text, CE loss) + map in those colours, colours drawn per sample (prompt: LEGEND_PROMPT)
#   seg2img             COCO-Stuff palette segmentation map -> photo   (unchanged)
# Every sample draws its mode independently from the 118,287 train2017 images; val2017 stays held out.
# Evaluate with inference.benchmark.eval_seg_img2palette --format legend (EVAL_TASKS=img2legend).
#   bash scripts/spike_submit.sh coco-lora-v4 lora data/configs/spike/cocostuff_legend_seg2img.yaml \
#       --total_steps 4000 --warmup_steps 100 --save_every 500 --log_every 10

cocostuff_multitask:
  datasets:
    cocostuff_train2017:
      data_dir:   # Spike: flowmatching PVC mounted at /data
        images: /data/datasets/segmentation/train2017.zip
        labels: /data/datasets/segmentation/stuffthingmaps_trainval2017.zip
        split: train2017
      num_total_samples: 118287
  mode_weights:
    img2palette_legend: 0.5
    seg2img: 0.5
  image_transform_args:           # COCO images are ~640x480 -> e.g. 512x384 (768 latent tokens)
    image_stride: 16
    max_image_size: 512
    min_image_size: 256
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  shuffle_seed: 0
  weight: 1.0
