# CelebAMask-HQ, two modes mixed in one run with 50/50 sampling (CelebAMaskMultiTaskDataset, data/celebamask.py).
# Same as celebamask_img2palette_seg2img.yaml except that segmentation uses the released model's own
# generic-segmentation format instead of the fixed palette:
#   img2palette_legend  face photo -> colour legend <p>class<color>(R, G, B)</color></p> of the face classes
#                       present (text, CE loss) + map in those colours, background black (prompt: LEGEND_PROMPT)
#   seg2img             CelebAMask-HQ palette segmentation map -> face photo   (unchanged)
# Every sample draws its mode independently (weights below), from the 24,183 train-split images;
# val/test stay held out. Evaluate with inference.benchmark.eval_seg_img2palette --format legend
# (EVAL_TASKS=img2legend).
#   bash scripts/spike_submit.sh celeba-lora-v4 lora data/configs/spike/celebamask_legend_seg2img.yaml \
#       --total_steps 4000 --warmup_steps 100 --save_every 500 --log_every 10

celebamask_multitask:
  datasets:
    celebamask_hq:
      data_dir: /data/datasets/segmentation/CelebAMask-HQ   # Spike: archive.zip extracted in the segmentation folder
      num_total_samples: 24183
  split: train
  mode_weights:
    img2palette_legend: 0.5
    seg2img: 0.5
  image_transform_args:
    image_stride: 16
    max_image_size: 512
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  shuffle_seed: 0
  weight: 1.0
