# CelebAMask-HQ: photo and colour-coded map on one symmetric flow (docs/SYMMETRIC.md). Every sample holds both, with one
# shared t, so there is no direction to sample. Needs --timestep_shift 1.0.
#   bash scripts/finetune_lora.sh data/configs/celebamask_hq/celebamask_symm.yaml --output_dir results/symm/<run> \
#       --timestep_shift 1.0 --init_adapter <adapter dir> --quant nf4

celebamask_multitask:
  datasets:
    celebamask_hq:
      data_dir: /datasets/CelebAMask-HQ/CelebAMask-HQ
      num_total_samples: 24183
  split: train
  mode_weights:
    symm: 1.0
  symm_beta: 10            # map dequantization, 0-255 scale
  symm_vit_prob: 0.5       # share of samples with the photo's ViT tokens as a clean prefix; 0 = pure symmetric flow
  symm_endpoint_prob: 0.2  # share of samples at t = 0 or 1, where both tasks start; the rest is uniform
  image_transform_args:
    image_stride: 16
    max_image_size: 512
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  shuffle_seed: 0
  weight: 1.0
