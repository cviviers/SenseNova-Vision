# CelebAMask-HQ, two modes mixed in one run with 50/50 sampling (CelebAMaskMultiTaskDataset, data/celebamask.py):
#   img2palette  face photo -> CelebAMask-HQ palette segmentation map   (prompt: IMG2PALETTE_PROMPT)
#   seg2img      CelebAMask-HQ palette segmentation map -> face photo   (prompt: SEG2IMG_PROMPT)
# Every sample draws its mode independently (weights below), from the 24,183 train-split images;
# val/test stay held out.
#   bash scripts/finetune_lora.sh data/configs/celebamask_hq/celebamask_img2palette_seg2img.yaml \
#       --output_dir results/celebamask_lora_i2p_s2i --total_steps 3000 --save_every 500

celebamask_multitask:
  datasets:
    celebamask_hq:
      data_dir: /datasets/CelebAMask-HQ/CelebAMask-HQ   # container path; CELEBAMASK_HQ_ROOT sets the registry default
      num_total_samples: 24183
  split: train
  mode_weights:
    img2palette: 0.5
    seg2img: 0.5
  image_transform_args:
    image_stride: 16
    max_image_size: 512
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  shuffle_seed: 0
  weight: 1.0
